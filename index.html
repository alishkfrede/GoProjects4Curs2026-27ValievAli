<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Service Auth</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { margin-top: 0; color: #333; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin: 5px 0 15px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #45a049; }
        button.logout { background-color: #f44336; float: right; font-size: 14px; padding: 5px 10px; }
        .hidden { display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .error { color: red; margin-bottom: 10px; }
        .success { color: green; margin-bottom: 10px; }
        .role-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.8em; color: white; margin-left: 10px; }
        .role-admin { background-color: #9c27b0; }
        .role-viewer { background-color: #2196F3; }
        .role-uploader { background-color: #FF9800; }
    </style>
</head>
<body>
    <div id="login-section" class="card">
        <h2>Вход в систему</h2>
        <div id="login-error" class="error"></div>
        <label>Логин:</label>
        <input type="text" id="username" placeholder="admin, user2 или user3">
        <label>Пароль:</label>
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="login()">Войти</button>
        <p style="font-size: 0.9em; color: #666;">
            Подсказка:<br>
            admin / admin123 (Загрузка + Просмотр)<br>
            user2 / user2pass (Только просмотр)<br>
            user3 / user3pass (Только загрузка)
        </p>
    </div>

    <div id="app-section" class="hidden">
        <div class="card">
            <button class="logout" onclick="logout()">Выйти</button>
            <h2>Панель управления <span id="user-display"></span></h2>
            <div id="message-box"></div>
        </div>

        <div id="upload-block" class="card hidden">
            <h3>Загрузить файл</h3>
            <input type="file" id="file-input">
            <button onclick="uploadFile()">Отправить</button>
        </div>

        <div id="list-block" class="card hidden">
            <h3>Список файлов по форматам</h3>
            <button onclick="loadList()" style="background-color: #2196F3; margin-bottom: 10px;">Обновить список</button>
            <div id="folders-container"></div>
        </div>
    </div>

    <script>
        const API_URL = ''; // Относительный путь, так как HTML отдается тем же сервером
        let currentUser = null;

        function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('login-error');

            if (!user || !pass) {
                errorDiv.innerText = "Введите логин и пароль";
                return;
            }

            const authHeader = 'Basic ' + btoa(user + ':' + pass);

            fetch(`${API_URL}/me`, {
                method: 'GET',
                headers: { 'Authorization': authHeader }
            })
            .then(response => {
                if (!response.ok) {
                    if (response.status === 401) throw new Error("Неверный логин или пароль");
                    throw new Error("Ошибка авторизации");
                }
                return response.json();
            })
            .then(data => {
                currentUser = { username: data.username, role: data.role, authHeader: authHeader };
                initUI();
            })
            .catch(err => {
                errorDiv.innerText = err.message;
            });
        }

        function logout() {
            currentUser = null;
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('app-section').classList.add('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('login-error').innerText = '';
        }

        function initUI() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('app-section').classList.remove('hidden');
            
            const roleBadgeClass = `role-${currentUser.role}`;
            const roleName = currentUser.role === 'admin' ? 'Администратор' : 
                             currentUser.role === 'viewer' ? 'Наблюдатель' : 'Загрузчик';
            
            document.getElementById('user-display').innerHTML = `${currentUser.username} <span class="role-badge ${roleBadgeClass}">${roleName}</span>`;

            const uploadBlock = document.getElementById('upload-block');
            const listBlock = document.getElementById('list-block');

            if (currentUser.role === 'admin' || currentUser.role === 'uploader') {
                uploadBlock.classList.remove('hidden');
            } else {
                uploadBlock.classList.add('hidden');
            }

            if (currentUser.role === 'admin' || currentUser.role === 'viewer') {
                listBlock.classList.remove('hidden');
                loadList();
            } else {
                listBlock.classList.add('hidden');
            }
        }

        function uploadFile() {
            const fileInput = document.getElementById('file-input');
            const msgBox = document.getElementById('message-box');
            
            if (fileInput.files.length === 0) {
                alert("Выберите файл!");
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            msgBox.innerHTML = '<span class="success">Загрузка...</span>';

            fetch(`${API_URL}/upload`, {
                method: 'POST',
                headers: { 'Authorization': currentUser.authHeader },
                body: formData
            })
            .then(res => {
                if (!res.ok) throw new Error(res.statusText);
                return res.text();
            })
            .then(text => {
                msgBox.innerHTML = `<span class="success">${text}</span>`;
                fileInput.value = '';
                if (currentUser.role === 'admin') loadList();
            })
            .catch(err => {
                msgBox.innerHTML = `<span class="error">Ошибка: ${err.message}</span>`;
            });
        }

        function loadList() {
            const container = document.getElementById('folders-container');
            container.innerHTML = 'Загрузка...';

            fetch(`${API_URL}/list`, {
                method: 'GET',
                headers: { 'Authorization': currentUser.authHeader }
            })
            .then(res => {
                if (!res.ok) throw new Error("Ошибка доступа");
                return res.json();
            })
            .then(data => {
                if (data.length === 0) {
                    container.innerHTML = '<p>Папки пусты.</p>';
                    return;
                }

                let html = '';
                data.forEach(dir => {
                    html += `<div style="margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px;">`;
                    html += `<strong>📁 Папка формата: ${dir.folder.toUpperCase()}</strong>`;
                    
                    if (dir.files && dir.files.length > 0) {
                        html += `<table><tr><th>Имя файла</th></tr>`;
                        dir.files.forEach(file => {
                            html += `<tr><td>${file}</td></tr>`;
                        });
                        html += `</table>`;
                    } else {
                        html += `<p style="color:#999; font-style:italic;">(пусто)</p>`;
                    }
                    html += `</div>`;
                });
                container.innerHTML = html;
            })
            .catch(err => {
                container.innerHTML = `<span class="error">Не удалось загрузить список: ${err.message}</span>`;
            });
        }
    </script>
</body>
</html>
